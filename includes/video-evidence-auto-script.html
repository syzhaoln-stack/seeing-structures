<script>
(() => {
  if (globalThis.VideoEvidenceAutoReady) return;
  const offset = document.querySelector('meta[name="quarto:offset"]')?.content || "./";
  const bookRoot = new URL(offset, document.baseURI);
  const files = [
    "assets/video-evidence-manifest.js",
    "assets/video-evidence.js",
    "assets/video-evidence-auto.js"
  ];

  const load = (file) => new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = new URL(file, bookRoot).href;
    script.dataset.videoEvidenceSrc = file;
    script.onload = resolve;
    script.onerror = () => reject(new Error(`无法载入 ${file}`));
    document.head.append(script);
  });

  globalThis.VideoEvidenceAutoReady = (async () => {
    for (const file of files) await load(file);
  })().catch((error) => {
    console.error("视频证据组件载入失败", error);
    throw error;
  });
})();
</script>
