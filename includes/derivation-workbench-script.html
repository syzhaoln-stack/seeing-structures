<script>
(() => {
  if (globalThis.DerivationWorkbenchReady) return;
  const offset = document.querySelector('meta[name="quarto:offset"]')?.content || "./";
  const bookRoot = new URL(offset, document.baseURI);
  const file = "assets/derivation-workbench.js";

  globalThis.DerivationWorkbenchReady = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = new URL(file, bookRoot).href;
    script.dataset.derivationWorkbenchSrc = file;
    script.onload = resolve;
    script.onerror = () => reject(new Error(`无法载入 ${file}`));
    document.head.append(script);
  }).catch((error) => {
    console.error("可视化推导台载入失败；页面保留静态推导链。", error);
    throw error;
  });
})();
</script>
