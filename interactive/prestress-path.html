<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>预应力路径</title><link rel="stylesheet" href="common.css"></head><body><main><section class="lab"><header><div><span class="tag">LAB 07 · PRESTRESS PATH</span><h1>结构带着历史进入使用阶段</h1><p>按时间推进张拉、传力、损失和使用荷载；每一步都在前一步状态上叠加。</p></div></header><div class="grid"><div class="controls"><div class="control"><label for="ps">初始预应力 P <output id="psv" class="value"></output></label><input id="ps" type="range" min="400" max="2200" step="20" value="1300"></div><div class="control"><label for="ep">钢束偏心 e <output id="epv" class="value"></output></label><input id="ep" type="range" min="0" max="240" step="5" value="160"></div><div class="control"><label for="loss">总损失率 <output id="lossv" class="value"></output></label><input id="loss" type="range" min="0" max="45" value="18"></div><div class="control"><label for="q">使用均布荷载 q <output id="qv" class="value"></output></label><input id="q" type="range" min="0" max="35" value="16"></div><div class="control"><label>阶段</label><div class="buttons"><button data-step="0">浇筑</button><button data-step="1">传力</button><button data-step="2" aria-pressed="true">损失后</button><button data-step="3">使用</button></div></div><div class="readouts"><div class="readout"><b id="pe"></b><span>当前有效预应力</span></div><div class="readout"><b id="top"></b><span>上缘应力</span></div><div class="readout"><b id="bottom"></b><span>下缘应力</span></div><div class="readout" id="shapeBox"><b id="shape"></b><span>变形趋势</span></div></div><p class="note">矩形截面 300×600 mm、跨度20 m，压应力记为正；只使用弹性叠加和汇总损失。</p></div><div class="view"><svg viewBox="0 0 740 480" role="img" aria-labelledby="t d"><title id="t">预应力梁阶段路径</title><desc id="d">显示钢束位置、梁的上拱或下挠、应力分布与时间阶段。</desc><g transform="translate(35 35)"><text class="strong-label" x="320" y="0" text-anchor="middle">梁与钢束</text><path id="beam" d="M30 105 Q320 105 610 105" fill="none" stroke="#93a0a5" stroke-width="70"/><path id="tendon" d="M35 105 Q320 140 605 105" fill="none" stroke="#d83b3b" stroke-width="6"/><line x1="30" x2="30" y1="145" y2="175" stroke="#182329" stroke-width="3"/><line x1="610" x2="610" y1="145" y2="175" stroke="#182329" stroke-width="3"/><text id="stagelabel" class="strong-label" x="320" y="205" text-anchor="middle"></text></g><g transform="translate(40 280)"><text class="strong-label" x="0" y="0">截面应力（压为正）</text><rect x="30" y="35" width="110" height="160" fill="#edf2f3" stroke="#182329"/><line id="tendonSec" x1="43" x2="127" y1="0" y2="0" stroke="#d83b3b" stroke-width="6"/><line class="axis" x1="225" x2="225" y1="35" y2="195"/><path id="stress" d="" fill="#2457d6" opacity=".25" stroke="#2457d6" stroke-width="3"/><text class="label" x="165" y="224">拉 ← 0 → 压</text></g><g transform="translate(390 278)"><text class="strong-label" x="0" y="0">过程账本</text><g id="ledger"></g></g></svg><p id="narration" class="note" aria-live="polite"></p></div></div></section></main><script>
const $=s=>document.querySelector(s),ps=$('#ps'),ep=$('#ep'),loss=$('#loss'),q=$('#q');let step=2;document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{step=+b.dataset.step;document.querySelectorAll('[data-step]').forEach(x=>x.setAttribute('aria-pressed',x===b));update()});function update(){const P=+ps.value,e=+ep.value,l=+loss.value/100,Q=+q.value;$('#psv').value=P+' kN';$('#epv').value=e+' mm';$('#lossv').value=Math.round(l*100)+'%';$('#qv').value=Q+' kN/m';const factor=step===0?0:step===1?1:1-l,Pe=P*factor,A=180000,W=18000000,Mp=Pe*1000*e/W,ax=Pe*1000/A,M=step===3?Q*20*20/8*1e6/W:0,top=ax-Mp+M,bottom=ax+Mp-M,net=M-Mp,shape=Math.abs(net)<.35?'接近平直':net>0?'下挠':'上拱';$('#pe').textContent=Pe.toFixed(0)+' kN';$('#top').textContent=(top>=0?'压 ':'拉 ')+Math.abs(top).toFixed(2)+' MPa';$('#bottom').textContent=(bottom>=0?'压 ':'拉 ')+Math.abs(bottom).toFixed(2)+' MPa';$('#shape').textContent=shape;$('#shapeBox').className='readout '+(top<0||bottom<0?'warn':'good');const sag=Math.max(-55,Math.min(55,net*6));$('#beam').setAttribute('d',`M30 105 Q320 ${105+sag} 610 105`);const ty=105+e/240*31;$('#tendon').setAttribute('d',`M35 105 Q320 ${ty} 605 105`);$('#tendonSec').setAttribute('y1',35+e/240*150);$('#tendonSec').setAttribute('y2',35+e/240*150);const scale=11,xTop=225+top*scale,xBot=225+bottom*scale;$('#stress').setAttribute('d',`M225 35 L${xTop} 35 L${xBot} 195 L225 195Z`);const names=['浇筑：尚未施加预应力','传力：初始预应力进入混凝土','损失后：长期有效预应力下降','使用：外荷载叠加'];$('#stagelabel').textContent=names[step]+' ｜ '+shape;const ledger=$('#ledger');ledger.innerHTML='';names.forEach((name,i)=>{const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.innerHTML=`<circle cx="12" cy="${35+i*42}" r="7" fill="${i<=step?'#087d65':'#cbd5d8'}"/><text x="30" y="${40+i*42}" class="${i===step?'strong-label':'label'}">${name.split('：')[0]}</text>`;ledger.append(g)});$('#narration').textContent=step===0?'此时只有构件自重等初始作用；预应力不能被假定为已经存在。':step===1?'传力瞬间预应力最大，构件可能上拱；施工阶段也需要验算。':step===2?`损失把预应力从 ${P.toFixed(0)} kN 降到 ${Pe.toFixed(0)} kN。汇总比例方便，但没有解释损失发生在哪里、何时发生。`:`使用荷载与已有预应力状态叠加。当前${shape}，这是一组可调参数的结果，不是唯一最优解。`}[ps,ep,loss,q].forEach(e=>e.addEventListener('input',update));update();
</script></body></html>
