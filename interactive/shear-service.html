<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>剪力与使用性能</title><link rel="stylesheet" href="common.css"></head><body><main><section class="lab"><header><div><span class="tag">LAB 05 · LOAD PATH</span><h1>移动荷载，四幅图一起动</h1><p>同一集中力同时决定支反力、剪力图、弯矩图和挠曲线；配箍只改变裂缝控制提示，不改变静定梁内力。</p></div></header><div class="grid"><div class="controls"><div class="control"><label for="p">集中力 P <output id="pv" class="value"></output></label><input id="p" type="range" min="20" max="180" step="5" value="90"></div><div class="control"><label for="a">荷载位置 a/L <output id="av" class="value"></output></label><input id="a" type="range" min="10" max="90" value="50"></div><div class="control"><label for="ei">相对刚度 EI <output id="eiv" class="value"></output></label><input id="ei" type="range" min="50" max="200" value="100"></div><div class="control"><label for="st">配箍水平 <output id="stv" class="value"></output></label><input id="st" type="range" min="0" max="100" value="45"></div><div class="readouts"><div class="readout"><b id="ra"></b><span>左支反力 RA</span></div><div class="readout"><b id="rb"></b><span>右支反力 RB</span></div><div class="readout"><b id="mmax"></b><span>荷载处最大弯矩</span></div><div class="readout warn"><b id="dmax"></b><span>最大挠度代理</span></div></div><p class="note">简支、线弹性、单一集中力。裂缝图为概念提示；不执行规范抗剪或裂缝宽度计算。</p></div><div class="view"><svg viewBox="0 0 760 560" role="img" aria-labelledby="t d"><title id="t">移动荷载下梁的同步响应</title><desc id="d">从上到下显示梁、剪力图、弯矩图和挠曲线。</desc><g transform="translate(45 25)"><text class="strong-label" x="0" y="0">外荷载与裂缝提示</text><line x1="25" x2="655" y1="72" y2="72" stroke="#7f8c91" stroke-width="18"/><path d="M5 102H45L25 77Z M635 102H675L655 77Z" fill="#182329"/><line id="loadline" x1="340" x2="340" y1="20" y2="58" stroke="#182329" stroke-width="3"/><path id="loadarrow" d="M340 62l-7-13h14z" fill="#182329"/><text id="plabel" class="strong-label" x="340" y="16" text-anchor="middle"></text><g id="cracks"></g></g><g transform="translate(45 145)"><text class="strong-label" x="0" y="0">剪力 V(x)</text><line class="axis" x1="25" x2="655" y1="65" y2="65"/><path id="vpath" fill="#d83b3b" opacity=".25" stroke="#d83b3b" stroke-width="2"/><text id="vlabels" class="label" x="0" y="0"></text></g><g transform="translate(45 265)"><text class="strong-label" x="0" y="0">弯矩 M(x)</text><line class="axis" x1="25" x2="655" y1="25" y2="25"/><path id="mpath" fill="#2457d6" opacity=".22" stroke="#2457d6" stroke-width="2"/></g><g transform="translate(45 405)"><text class="strong-label" x="0" y="0">挠曲线 y(x)</text><line class="axis" x1="25" x2="655" y1="25" y2="25"/><path id="ypath" fill="none" stroke="#087d65" stroke-width="4"/><circle id="ymax" r="5" fill="#087d65"/><text id="ylabel" class="label" x="0" y="0"></text></g><text class="label" x="70" y="545">0</text><text class="label" x="700" y="545">L = 10 m</text></svg><p id="narration" class="note" aria-live="polite"></p></div></div></section></main><script>
const $=s=>document.querySelector(s),p=$('#p'),a=$('#a'),ei=$('#ei'),st=$('#st');function update(){const P=+p.value,A=+a.value/100,B=1-A,EI=+ei.value/100,S=+st.value/100,RA=P*B,RB=P*A,M=P*A*B*10;$('#pv').value=P+' kN';$('#av').value=A.toFixed(2);$('#eiv').value=EI.toFixed(2)+'×';$('#stv').value=Math.round(S*100)+'%';$('#ra').textContent=RA.toFixed(1)+' kN';$('#rb').textContent=RB.toFixed(1)+' kN';$('#mmax').textContent=M.toFixed(0)+' kN·m';const X=t=>25+630*t,loadX=X(A);$('#loadline').setAttribute('x1',loadX);$('#loadline').setAttribute('x2',loadX);$('#loadarrow').setAttribute('d',`M${loadX} 62l-7-13h14z`);$('#plabel').setAttribute('x',loadX);$('#plabel').textContent=P+' kN';const vs=48/Math.max(RA,RB,1);$('#vpath').setAttribute('d',`M25 65 L25 ${65-RA*vs} L${loadX} ${65-RA*vs} L${loadX} ${65+RB*vs} L655 ${65+RB*vs} L655 65Z`);let md=`M25 25 L${loadX} ${25+Math.min(84,M*.22)} L655 25Z`;$('#mpath').setAttribute('d',md);let d='',maxY=0,maxT=0;for(let i=0;i<=120;i++){const t=i/120;let y;if(t<=A)y=B*t*(1-B*B-t*t);else y=A*(1-t)*(1-A*A-(1-t)*(1-t));y=P*y/EI; if(y>maxY){maxY=y;maxT=t}d+=(i?'L':'M')+X(t).toFixed(1)+' '+(25+Math.min(100,y*.28)).toFixed(1)}$('#ypath').setAttribute('d',d);$('#ymax').setAttribute('cx',X(maxT));$('#ymax').setAttribute('cy',25+Math.min(100,maxY*.28));$('#ylabel').setAttribute('x',X(maxT)+8);$('#ylabel').setAttribute('y',22+Math.min(100,maxY*.28));$('#ylabel').textContent='最大挠度';$('#dmax').textContent=(maxY/22).toFixed(2)+'×';const cracks=$('#cracks');cracks.innerHTML='';const risk=P*(1-S*.55);if(risk>55){const sides=A>.52?[.72,.82]:A<.48?[.18,.28]:[.2,.8];sides.forEach((t,i)=>{const q=document.createElementNS('http://www.w3.org/2000/svg','path');const x=X(t);q.setAttribute('d',`M${x} 82 l${t<.5?12:-12} -26 l${t<.5?8:-8} -12`);q.setAttribute('stroke','#d83b3b');q.setAttribute('stroke-width',Math.max(1,3-S*2));q.setAttribute('fill','none');cracks.append(q)})}$('#narration').textContent=`荷载移到跨长 ${(A*100).toFixed(0)}% 处后，左反力 ${RA.toFixed(1)}、右反力 ${RB.toFixed(1)} kN。改变配箍不会改变这组静定内力，但会改变斜裂缝后的传力能力与裂缝控制。`}[p,a,ei,st].forEach(e=>e.addEventListener('input',update));update();
</script></body></html>
