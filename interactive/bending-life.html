<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>梁的一生</title><link rel="stylesheet" href="common.css"></head><body><main><section class="lab"><header><div><span class="tag">LAB 04 · BENDING LIFE</span><h1>慢慢加载，不要跳到破坏</h1><p>拖动弯矩水平，观察刚度、裂缝、中性轴、钢筋和混凝土状态的连续变化。</p></div></header><div class="grid"><div class="controls"><div class="control"><label for="load">弯矩水平 <output id="lv" class="value"></output></label><input id="load" type="range" min="0" max="120" value="12"></div><div class="control"><label for="reinforce">配筋状态 <output id="rv" class="value"></output></label><input id="reinforce" type="range" min="65" max="145" value="100"></div><div class="readouts"><div class="readout"><b id="stage"></b><span>当前工作阶段</span></div><div class="readout"><b id="stiff"></b><span>相对刚度 EI</span></div><div class="readout"><b id="steel"></b><span>受拉钢筋</span></div><div class="readout" id="concbox"><b id="concrete"></b><span>受压混凝土</span></div></div><div class="equation">未开裂 → 开裂 → 钢筋屈服 → 混凝土压碎</div><p class="note">阶段阈值经过概念化处理；配筋增加会改变钢筋屈服与混凝土压碎的先后，用于讨论适筋、少筋与超筋风险。</p></div><div class="view"><svg viewBox="0 0 720 430" role="img" aria-labelledby="t d"><title id="t">钢筋混凝土梁加载全过程</title><desc id="d">上方为挠曲与裂缝，下方为截面应变及材料状态条。</desc><g transform="translate(25 20)"><line x1="45" x2="45" y1="80" y2="130" stroke="#182329" stroke-width="4"/><line x1="605" x2="605" y1="80" y2="130" stroke="#182329" stroke-width="4"/><path d="M25 130H65L45 108Z M585 130H625L605 108Z" fill="#182329"/><path id="beam" d="M45 82 Q325 82 605 82" fill="none" stroke="#7f8c91" stroke-width="24" class="animate"/><g id="cracks"></g><line x1="325" x2="325" y1="25" y2="68" stroke="#182329" stroke-width="3"/><path d="M325 68l-7-12h14z" fill="#182329"/><text id="beamlabel" class="strong-label" x="325" y="162" text-anchor="middle"></text></g><g transform="translate(35 210)"><text class="strong-label" x="0" y="0">截面状态</text><rect x="20" y="25" width="150" height="170" fill="#edf2f3" stroke="#182329" stroke-width="2"/><rect id="czone" x="20" y="25" width="150" height="55" fill="#2457d6" opacity=".22"/><line id="na" x1="20" x2="170" y1="80" y2="80" stroke="#2457d6" stroke-dasharray="6 4"/><line x1="38" x2="152" y1="171" y2="171" stroke="#d83b3b" stroke-width="9"/><path id="strain" d="" fill="none" stroke="#182329" stroke-width="3"/><text class="label" x="185" y="115">线性应变</text></g><g transform="translate(340 220)"><text class="strong-label" x="0" y="0">材料使用程度</text><text class="label" x="0" y="48">钢筋</text><rect x="65" y="31" width="250" height="20" fill="#e5eaec"/><rect id="steelbar" x="65" y="31" width="0" height="20" fill="#d83b3b"/><line x1="265" x2="265" y1="25" y2="57" stroke="#182329"/><text class="label" x="265" y="74" text-anchor="middle">屈服</text><text class="label" x="0" y="123">混凝土</text><rect x="65" y="106" width="250" height="20" fill="#e5eaec"/><rect id="concbar" x="65" y="106" width="0" height="20" fill="#2457d6"/><line x1="315" x2="315" y1="100" y2="132" stroke="#182329"/><text class="label" x="315" y="149" text-anchor="middle">压碎</text></g></svg><p id="narration" class="note" aria-live="polite"></p></div></div></section></main><script>
const $=s=>document.querySelector(s),load=$('#load'),reinforce=$('#reinforce');function update(){const L=+load.value,R=+reinforce.value/100,crack=22,yieldAt=78*R,crushAt=108/Math.max(.8,R),stage=L<crack?'未开裂':L<Math.min(yieldAt,crushAt)?'带裂缝工作':L>=crushAt?'混凝土压碎':L>=yieldAt?'钢筋屈服':'非线性发展',stiff=L<crack?1:Math.max(.22,.58-(L-crack)/250);$('#lv').value=L+'%';$('#rv').value=R.toFixed(2)+'×';$('#stage').textContent=stage;$('#stiff').textContent=stiff.toFixed(2)+' EI₀';$('#steel').textContent=L>=yieldAt?'已屈服':Math.min(100,L/yieldAt*100).toFixed(0)+'%';$('#concrete').textContent=L>=crushAt?'已压碎':Math.min(100,L/crushAt*100).toFixed(0)+'%';$('#concbox').className='readout '+(L>=crushAt?'warn':'');const sag=Math.min(90,L*1.0/stiff/2.2);$('#beam').setAttribute('d',`M45 82 Q325 ${82+sag} 605 82`);$('#beam').setAttribute('stroke',L>=crushAt?'#b86f00':'#7f8c91');$('#beamlabel').textContent=`挠度代理 ${(sag/10).toFixed(1)} ｜ ${stage}`;const xratio=.42+Math.min(.22,L/500*R),ny=25+xratio*170;$('#na').setAttribute('y1',ny);$('#na').setAttribute('y2',ny);$('#czone').setAttribute('height',ny-25);$('#strain').setAttribute('d',`M250 25 L${210-L*.22} ${ny} L${250+Math.min(70,L*.5)} 195`);$('#steelbar').setAttribute('width',Math.min(250,L/yieldAt*200));$('#concbar').setAttribute('width',Math.min(250,L/crushAt*250));const cracks=$('#cracks');cracks.innerHTML='';if(L>=crack){const n=Math.min(9,2+Math.floor((L-crack)/13));for(let i=0;i<n;i++){const x=180+i*(290/(n-1||1)),base=92+4*Math.sin(i);const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M${x} ${base+sag*(1-Math.abs(x-325)/280)} l-4 -${10+L*.15} l6 -10`);p.setAttribute('stroke','#d83b3b');p.setAttribute('stroke-width','2');p.setAttribute('fill','none');cracks.append(p)}}let msg=stage==='未开裂'?'梁已经变形并产生拉应变，只是受拉混凝土尚未达到开裂阈值。':stage==='带裂缝工作'?'开裂后刚度下降，钢筋逐步接管裂缝截面的拉力。带裂缝工作不是立即失效。':stage==='钢筋屈服'?'钢筋先屈服提供明显变形预警，这是希望获得的延性路径。':stage==='混凝土压碎'?(yieldAt<crushAt?'钢筋已经屈服后混凝土压碎：延性路径结束。':'混凝土在钢筋充分屈服前压碎：配筋过多可能让破坏更突然。'):'截面正在接近材料非线性区。';$('#narration').textContent=msg}
[load,reinforce].forEach(e=>e.addEventListener('input',update));update();
</script></body></html>
