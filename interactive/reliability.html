<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>可靠度</title><link rel="stylesheet" href="common.css"></head><body><main><section class="lab"><header><div><span class="tag">LAB 02 · RELIABILITY</span><h1>安全不是两个定值相减</h1><p>把抗力 R 与作用效应 S 看成分布；重叠区域提示失效可能，而非宣布某次必然失效。</p></div></header><div class="grid"><div class="controls">
<div class="control"><label for="mr">平均抗力 μR <output id="mrv" class="value"></output></label><input id="mr" type="range" min="80" max="180" value="130"></div><div class="control"><label for="sr">抗力离散 σR <output id="srv" class="value"></output></label><input id="sr" type="range" min="4" max="30" value="14"></div><div class="control"><label for="ms">平均效应 μS <output id="msv" class="value"></output></label><input id="ms" type="range" min="40" max="150" value="85"></div><div class="control"><label for="ss">效应离散 σS <output id="ssv" class="value"></output></label><input id="ss" type="range" min="4" max="30" value="12"></div>
<div class="readouts"><div class="readout" id="betabox"><b id="beta"></b><span>可靠指标 β（概念）</span></div><div class="readout warn"><b id="pf"></b><span>P(R−S≤0)</span></div><div class="readout"><b id="margin"></b><span>平均安全裕度</span></div><div class="readout"><b id="spread"></b><span>组合标准差</span></div></div><p class="note">假定 R、S 相互独立且服从正态分布。真实工程中的尾部、相关性与模型不确定性可能改变结论。</p></div>
<div class="view"><svg viewBox="0 0 700 420" role="img" aria-labelledby="t d"><title id="t">抗力与作用效应概率分布</title><desc id="d">蓝色为抗力分布，红色为效应分布，阴影为概念重叠区域。</desc><g transform="translate(35 25)"><line class="axis" x1="35" x2="625" y1="340" y2="340"/><line class="axis" x1="35" x2="35" y1="340" y2="25"/><g id="ticks"></g><path id="area" fill="#b86f00" opacity=".18"/><path id="rpath" class="blue animate" stroke-width="4"/><path id="spath" class="red animate" stroke-width="4"/><line id="fail" x1="0" x2="0" y1="45" y2="340" stroke="#b86f00" stroke-dasharray="5 5"/><text id="failLabel" class="strong-label" y="38" text-anchor="middle">R = S 边界</text><text class="strong-label" x="505" y="72" fill="#2457d6">抗力 R</text><text class="strong-label" x="125" y="72" fill="#d83b3b">效应 S</text><text class="label" x="520" y="380">同一量纲的效应值</text></g></svg><p id="narration" class="note" aria-live="polite"></p></div></div></section></main><script>
const $=s=>document.querySelector(s),els=['mr','sr','ms','ss'].map(x=>$('#'+x));function erf(x){const s=x<0?-1:1,a=Math.abs(x),t=1/(1+.3275911*a),a1=.254829592,a2=-.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429;const y=1-(((((a5*t+a4)*t+a3)*t+a2)*t+a1)*t)*Math.exp(-a*a);return s*y}function cdf(x){return .5*(1+erf(x/Math.sqrt(2)))}function update(){const [mr,sr,ms,ss]=els.map(x=>+x.value);$('#mrv').value=mr;$('#srv').value=sr;$('#msv').value=ms;$('#ssv').value=ss;const sd=Math.hypot(sr,ss),beta=(mr-ms)/sd,pf=cdf(-beta);$('#beta').textContent=beta.toFixed(2);$('#pf').textContent=pf<.0001?pf.toExponential(2):(pf*100).toFixed(2)+'%';$('#margin').textContent=(mr-ms).toFixed(0);$('#spread').textContent=sd.toFixed(1);$('#betabox').className='readout '+(beta>=3?'good':beta<2?'warn':'');
const min=20,max=210,X=v=>35+(v-min)/(max-min)*590,Y=(v,m,s)=>340-285*Math.exp(-.5*Math.pow((v-m)/s,2));function path(m,s){let d='';for(let i=0;i<=160;i++){const v=min+(max-min)*i/160;d+=(i?'L':'M')+X(v).toFixed(1)+' '+Y(v,m,s).toFixed(1)}return d}$('#rpath').setAttribute('d',path(mr,sr));$('#spath').setAttribute('d',path(ms,ss));let d='M'+X(min)+' 340';for(let i=0;i<=160;i++){const v=min+(max-min)*i/160,y=Math.max(Y(v,mr,sr),Y(v,ms,ss));d+='L'+X(v).toFixed(1)+' '+y.toFixed(1)}d+='L'+X(max)+' 340Z';$('#area').setAttribute('d',d);const boundary=X((mr+ms)/2);$('#fail').setAttribute('x1',boundary);$('#fail').setAttribute('x2',boundary);$('#failLabel').setAttribute('x',boundary);$('#narration').textContent=beta<2?'两条分布明显接近。先查控制变量、尾部分布和模型误差，不要把百分数当成完整风险结论。':beta<3?'平均值看似分开，但离散性仍贡献明显重叠。':'在当前正态、独立假定下分离度较高；假定本身仍需证据。'}els.forEach(x=>x.addEventListener('input',update));update();
</script></body></html>
