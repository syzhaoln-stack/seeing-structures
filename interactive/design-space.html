<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设计空间</title><link rel="stylesheet" href="common.css"></head><body><main><section class="lab"><header><div><span class="tag">LAB 01 · DESIGN SPACE</span><h1>同一目标，不止一个截面</h1><p>改变梁高、梁宽与配筋率，观察能力、挠度代理值、自重和净空怎样互相牵制。</p></div></header><div class="grid"><div class="controls">
<div class="control"><label for="h">梁高 h <output id="hv" class="value"></output></label><input id="h" type="range" min="500" max="1600" step="20" value="900"></div>
<div class="control"><label for="b">梁宽 b <output id="bv" class="value"></output></label><input id="b" type="range" min="250" max="700" step="10" value="400"></div>
<div class="control"><label for="rho">纵筋率 ρ <output id="rhov" class="value"></output></label><input id="rho" type="range" min="0.4" max="2.5" step="0.05" value="1.1"></div>
<div class="control"><label>设计偏好</label><div class="buttons"><button data-mode="balanced" aria-pressed="true">平衡</button><button data-mode="light">轻量</button><button data-mode="stiff">刚度</button></div></div>
<div class="equation">设计 ≠ 求唯一未知量<br>设计 = 在约束内比较可行解</div>
<div class="readouts"><div class="readout" id="capbox"><b id="cap"></b><span>抗弯能力代理 / 目标</span></div><div class="readout"><b id="defl"></b><span>相对挠度（越低越好）</span></div><div class="readout"><b id="weight"></b><span>每米混凝土体积</span></div><div class="readout warn"><b id="clear"></b><span>占用结构高度</span></div></div>
<p class="note">这是方案比较模型，不是规范配筋计算。能力采用简化比例式，忽略材料非线性与构造条件。</p></div>
<div class="view"><svg viewBox="0 0 700 470" role="img" aria-labelledby="t d"><title id="t">梁截面与方案空间</title><desc id="d">左侧显示梁截面和钢筋，右侧显示可行方案点及当前方案。</desc>
<g transform="translate(20 28)"><text class="strong-label" x="0" y="0">当前截面</text><rect id="section" x="75" y="40" width="180" height="310" rx="3" fill="#edf2f3" stroke="#182329" stroke-width="2" class="animate"/><line id="neutral" x1="75" x2="255" y1="115" y2="115" stroke="#2457d6" stroke-dasharray="6 5"/><text id="sectionLabel" class="label" x="165" y="380" text-anchor="middle"></text><g id="bars"></g><path id="compression" fill="#2457d6" opacity=".18" d=""/></g>
<g transform="translate(335 28)"><text class="strong-label" x="0" y="0">方案空间：自重 →　相对挠度 ↑</text><line class="axis" x1="45" x2="330" y1="370" y2="370"/><line class="axis" x1="45" x2="45" y1="370" y2="35"/><g id="cloud"></g><circle id="current" r="8" fill="#d83b3b" stroke="#fff" stroke-width="3"/><text id="pointLabel" class="strong-label" x="0" y="0">当前</text><path id="frontier" d="M75 320 C120 250 175 170 300 75" fill="none" stroke="#087d65" stroke-width="2" stroke-dasharray="6 5"/><text class="label" x="205" y="70">低挠度通常要付出尺寸或材料代价</text><text class="label" x="180" y="405">每米混凝土体积</text></g></svg><div class="legend"><span><i class="dot" style="background:#d83b3b"></i>当前方案</span><span><i class="dot" style="background:#087d65"></i>取舍前沿（概念）</span><span><i class="dot" style="background:#aebcc1"></i>其他可行方案</span></div><p id="narration" class="note" aria-live="polite"></p></div></div></section></main>
<script>
const $=s=>document.querySelector(s), h=$('#h'),b=$('#b'),rho=$('#rho');let mode='balanced';
const cloud=$('#cloud');for(let i=0;i<34;i++){const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',65+Math.random()*245);c.setAttribute('cy',60+Math.random()*285);c.setAttribute('r',3.3);c.setAttribute('fill','#aebcc1');c.setAttribute('opacity','.65');cloud.append(c)}
document.querySelectorAll('[data-mode]').forEach(x=>x.onclick=()=>{mode=x.dataset.mode;document.querySelectorAll('[data-mode]').forEach(y=>y.setAttribute('aria-pressed',y===x));update()});
function update(){const H=+h.value,B=+b.value,R=+rho.value;$('#hv').value=H+' mm';$('#bv').value=B+' mm';$('#rhov').value=R.toFixed(2)+'%';const cap=B*H*H*R/1e8, target=3.1, ratio=cap/target, I=B*Math.pow(H,3)/12,def=1e13/I,w=B*H/1e6;
$('#cap').textContent=ratio.toFixed(2);$('#defl').textContent=def.toFixed(2);$('#weight').textContent=w.toFixed(3)+' m³/m';$('#clear').textContent=(H/1000).toFixed(2)+' m';$('#capbox').className='readout '+(ratio>=1?'good':'warn');
const sw=80+B/700*150,sh=130+H/1600*240,x=165-sw/2,y=30;$('#section').setAttribute('x',x);$('#section').setAttribute('y',y);$('#section').setAttribute('width',sw);$('#section').setAttribute('height',sh);const ny=y+sh*(.19+.1*Math.min(R/2.5,1));$('#neutral').setAttribute('x1',x);$('#neutral').setAttribute('x2',x+sw);$('#neutral').setAttribute('y1',ny);$('#neutral').setAttribute('y2',ny);$('#compression').setAttribute('d',`M${x} ${y}H${x+sw}V${ny}H${x}Z`);$('#sectionLabel').textContent=`${B} × ${H} mm`;
const bars=$('#bars');bars.innerHTML='';const n=Math.max(2,Math.round(2+R*2));for(let i=0;i<n;i++){const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',x+18+i*(sw-36)/(n-1));c.setAttribute('cy',y+sh-21);c.setAttribute('r',5);c.setAttribute('fill','#d83b3b');bars.append(c)}
const px=55+Math.min((w-.125)/(.98),1)*270,py=365-Math.min(def/12,1)*315;$('#current').setAttribute('cx',px);$('#current').setAttribute('cy',py);$('#pointLabel').setAttribute('x',px+11);$('#pointLabel').setAttribute('y',py-8);
const msg=ratio<1?'能力约束尚未满足。先别优化漂亮指标，先回到可行域。':mode==='light'?'当前偏好会推动你减小截面，但必须盯住挠度、裂缝与施工排筋。':mode==='stiff'?'当前偏好奖励更高刚度，但净空与自重正在付出代价。':'当前方案已进入可比较范围；下一步需要价格、净空、耐久和施工数据。';$('#narration').textContent=msg}
[h,b,rho].forEach(x=>x.addEventListener('input',update));update();
</script></body></html>
