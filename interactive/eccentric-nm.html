<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>偏心受压</title><link rel="stylesheet" href="common.css"></head><body><main><section class="lab"><header><div><span class="tag">LAB 06 · N–M MAP</span><h1>偏心距把轴力变成弯矩</h1><p>需求点沿 M=Ne 移动。相关曲线是一张截面能力地图，不是两个独立最大值组成的矩形。</p></div></header><div class="grid"><div class="controls"><div class="control"><label for="n">轴力 N/N₀ <output id="nv" class="value"></output></label><input id="n" type="range" min="0" max="110" value="45"></div><div class="control"><label for="e">偏心距 e/h <output id="ev" class="value"></output></label><input id="e" type="range" min="0" max="120" value="35"></div><div class="control"><label for="sl">长细影响 <output id="slv" class="value"></output></label><input id="sl" type="range" min="0" max="80" value="15"></div><div class="readouts"><div class="readout"><b id="m"></b><span>一阶 M/M₀</span></div><div class="readout warn"><b id="m2"></b><span>含二阶放大</span></div><div class="readout" id="statusbox"><b id="status"></b><span>概念能力判断</span></div><div class="readout"><b id="sectionstate"></b><span>截面应变状态</span></div></div><div class="equation">M = N e　｜　M₂ ≈ M × 放大系数</div><p class="note">能力曲线为教学用归一化概念曲线，不对应任何具体截面或规范；二阶效应采用启发式放大。</p></div><div class="view"><svg viewBox="0 0 740 450" role="img" aria-labelledby="t d"><title id="t">偏心受压截面和N-M相关曲线</title><desc id="d">左侧显示应变状态，右侧显示轴力弯矩需求点与概念能力曲线。</desc><g transform="translate(25 35)"><text class="strong-label" x="90" y="0" text-anchor="middle">截面应变</text><rect x="35" y="35" width="110" height="300" fill="#edf2f3" stroke="#182329" stroke-width="2"/><line x1="48" x2="132" y1="58" y2="58" stroke="#2457d6" stroke-width="7"/><line x1="48" x2="132" y1="312" y2="312" stroke="#d83b3b" stroke-width="7"/><line class="axis" x1="200" x2="200" y1="35" y2="335"/><line id="strain" x1="0" y1="35" x2="0" y2="335" stroke="#182329" stroke-width="4"/><line id="zero" x1="165" x2="245" y1="0" y2="0" stroke="#b86f00" stroke-dasharray="5 4"/><text id="zerolabel" class="label" x="248" y="0">ε=0</text><line id="force" x1="90" x2="90" y1="-8" y2="25" stroke="#182329" stroke-width="4"/><path id="forcearrow" d="M90 31l-7-13h14z" fill="#182329"/><text id="elabel" class="label" x="90" y="365" text-anchor="middle"></text></g><g transform="translate(320 35)"><text class="strong-label" x="180" y="0" text-anchor="middle">归一化 N–M 能力地图</text><line class="axis" x1="40" x2="365" y1="350" y2="350"/><line class="axis" x1="40" x2="40" y1="350" y2="35"/><text class="label" x="350" y="382">M/M₀</text><text class="label" x="5" y="40">N/N₀</text><path id="curve" fill="#2457d6" opacity=".12" stroke="#2457d6" stroke-width="4"/><line id="ray" x1="40" y1="350" x2="40" y2="350" stroke="#8a989e" stroke-dasharray="5 5"/><circle id="demand" r="8" fill="#d83b3b" stroke="#fff" stroke-width="3"/><circle id="demand1" r="5" fill="#b86f00"/><text id="dlabel" class="strong-label" x="0" y="0">含二阶</text></g></svg><p id="narration" class="note" aria-live="polite"></p></div></div></section></main><script>
const $=s=>document.querySelector(s),n=$('#n'),e=$('#e'),sl=$('#sl');const X=m=>40+Math.min(m/1.65,1)*325,Y=N=>350-Math.min(N/1.15,1)*315;function cap(N){return Math.max(0,(1-Math.pow(N,1.65))*(1+.68*N))}function update(){const N=+n.value/100,E=+e.value/100,S=+sl.value/100,M=N*E*1.35,amp=1/(1-Math.min(.68,N*S*.9)),M2=M*amp,C=cap(Math.min(N,1));$('#nv').value=N.toFixed(2);$('#ev').value=E.toFixed(2);$('#slv').value=S.toFixed(2);$('#m').textContent=M.toFixed(2);$('#m2').textContent=M2.toFixed(2);const ok=N<=1&&M2<=C;$('#status').textContent=ok?'曲线内':'曲线外';$('#statusbox').className='readout '+(ok?'good':'warn');const state=E<.12?'全截面受压':E<.45?'小偏心倾向':'一侧受拉';$('#sectionstate').textContent=state;const top=200-50*(1-E*1.3),bottom=200-50*(1+E*2.5);$('#strain').setAttribute('x1',top);$('#strain').setAttribute('x2',bottom);let zy=35;if((top-200)*(bottom-200)<0)zy=35+(200-top)/(bottom-top)*300;else zy=top<200&&bottom<200?350:20;$('#zero').setAttribute('y1',zy);$('#zero').setAttribute('y2',zy);$('#zerolabel').setAttribute('y',zy+4);const fx=90+Math.min(52,E*45);$('#force').setAttribute('x1',fx);$('#force').setAttribute('x2',fx);$('#forcearrow').setAttribute('d',`M${fx} 31l-7-13h14z`);$('#elabel').textContent=`e/h = ${E.toFixed(2)}`;let d='M40 350';for(let i=0;i<=100;i++){const nn=i/100,mm=cap(nn);d+='L'+X(mm).toFixed(1)+' '+Y(nn).toFixed(1)}d+='L40 350Z';$('#curve').setAttribute('d',d);$('#demand1').setAttribute('cx',X(M));$('#demand1').setAttribute('cy',Y(N));$('#demand').setAttribute('cx',X(M2));$('#demand').setAttribute('cy',Y(N));$('#ray').setAttribute('x2',X(M2));$('#ray').setAttribute('y2',Y(N));$('#dlabel').setAttribute('x',X(M2)+10);$('#dlabel').setAttribute('y',Y(N)-10);$('#narration').textContent=ok?`需求点仍在概念能力曲线内。二阶作用把弯矩从 ${M.toFixed(2)} 放大到 ${M2.toFixed(2)}；“在曲线内”仍不等于构造和整体稳定已满足。`:`需求点越过概念能力边界。可改变截面、配筋、长细约束或体系，而不是寻找另一条公式掩盖超限。`}[n,e,sl].forEach(q=>q.addEventListener('input',update));update();
</script></body></html>
