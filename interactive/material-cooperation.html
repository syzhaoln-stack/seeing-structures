<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>材料协同</title><link rel="stylesheet" href="common.css"></head><body><main><section class="lab"><header><div><span class="tag">LAB 03 · MATERIAL COOPERATION</span><h1>从变形追到内力</h1><p>只调一个“曲率”变量，截面变形、应变、材料应力与合力同步变化。</p></div></header><div class="grid"><div class="controls"><div class="control"><label for="k">曲率水平 <output id="kv" class="value"></output></label><input id="k" type="range" min="0" max="100" value="25"></div><div class="control"><label for="x">中性轴深度 x/h <output id="xv" class="value"></output></label><input id="x" type="range" min="18" max="65" value="38"></div><div class="control"><label for="rho">配筋面积比例 <output id="rv" class="value"></output></label><input id="rho" type="range" min="40" max="160" value="90"></div><div class="readouts"><div class="readout"><b id="ec"></b><span>顶缘混凝土应变</span></div><div class="readout"><b id="es"></b><span>钢筋应变</span></div><div class="readout" id="crackbox"><b id="state"></b><span>受拉混凝土状态</span></div><div class="readout"><b id="balance"></b><span>压/拉合力比</span></div></div><div class="equation">变形 → 应变 → 应力 → 内力<br>平截面假定连接几何与材料</div><p class="note">截面状态被独立控制，未强制满足 C=T；“合力比”正用来暴露你的状态假定是否平衡。</p></div><div class="view"><svg viewBox="0 0 720 430" role="img" aria-labelledby="t d"><title id="t">钢筋混凝土截面四层翻译</title><desc id="d">依次显示变形截面、线性应变、材料应力和压拉合力。</desc><g transform="translate(18 30)"><text class="strong-label" x="65" y="0" text-anchor="middle">1 变形</text><path id="beam" d="M15 80 Q65 80 115 80 L115 340 Q65 340 15 340 Z" fill="#edf2f3" stroke="#182329" stroke-width="2"/><line id="barline" x1="22" x2="108" y1="310" y2="310" stroke="#d83b3b" stroke-width="7"/><g id="cracks"></g></g><g transform="translate(165 30)"><text class="strong-label" x="75" y="0" text-anchor="middle">2 应变</text><line class="axis" x1="75" x2="75" y1="55" y2="350"/><line id="strain" x1="0" y1="55" x2="0" y2="350" stroke="#182329" stroke-width="3"/><line id="na" x1="35" x2="125" y1="0" y2="0" stroke="#2457d6" stroke-dasharray="5 4"/><text id="nalabel" class="label" x="128" y="0">ε=0</text><text class="label" x="10" y="380">压 ←　→ 拉</text></g><g transform="translate(335 30)"><text class="strong-label" x="80" y="0" text-anchor="middle">3 应力</text><line class="axis" x1="80" x2="80" y1="55" y2="350"/><path id="cstress" fill="#2457d6" opacity=".3"/><line id="sstress" x1="80" x2="80" y1="310" y2="310" stroke="#d83b3b" stroke-width="8"/><text class="label" x="16" y="380">混凝土压应力 + 钢筋拉应力</text></g><g transform="translate(530 30)"><text class="strong-label" x="75" y="0" text-anchor="middle">4 内力</text><rect x="25" y="55" width="100" height="295" fill="#f5f8f8" stroke="#cbd5d8"/><line id="C" x1="75" x2="75" y1="0" y2="0" stroke="#2457d6" stroke-width="9"/><path id="Ca" d="" fill="#2457d6"/><line id="T" x1="75" x2="75" y1="310" y2="310" stroke="#d83b3b" stroke-width="9"/><path id="Ta" d="" fill="#d83b3b"/><text id="ct" class="strong-label" x="80" y="100">C</text><text id="tt" class="strong-label" x="80" y="315">T</text></g></svg><p id="narration" class="note" aria-live="polite"></p></div></div></section></main><script>
const $=s=>document.querySelector(s),k=$('#k'),x=$('#x'),rho=$('#rho');function update(){const K=+k.value/100,X=+x.value/100,R=+rho.value/100,ec=K*.0035,es=ec*(.9-X)/X,cracked=es>.00012,fc=Math.min(ec/.002,1)*30,C=fc*X,T=Math.min(es/.002,1)*40*R,ratio=T?C/T:0;$('#kv').value=Math.round(K*100)+'%';$('#xv').value=X.toFixed(2);$('#rv').value=R.toFixed(2)+'×';$('#ec').textContent=(ec*1000).toFixed(2)+'‰';$('#es').textContent=(es*1000).toFixed(2)+'‰';$('#state').textContent=cracked?'已开裂':'未开裂';$('#crackbox').className='readout '+(cracked?'warn':'good');$('#balance').textContent=T?ratio.toFixed(2):'—';const y=55+X*295;$('#na').setAttribute('y1',y);$('#na').setAttribute('y2',y);$('#nalabel').setAttribute('y',y+4);const top=75-65*K,bottom=75+Math.min(70,95*K*(1-X)/X);$('#strain').setAttribute('x1',top);$('#strain').setAttribute('x2',bottom);$('#cstress').setAttribute('d',`M80 55 H${80-65*Math.min(ec/.002,1)} L80 ${y} Z`);$('#sstress').setAttribute('x2',80+Math.min(72,es/.002*72));const cy=55+X*295/3,cl=25+Math.min(C*2.3,115),tl=25+Math.min(T*2.3,115);$('#C').setAttribute('x1',75);$('#C').setAttribute('x2',cl);$('#C').setAttribute('y1',cy);$('#C').setAttribute('y2',cy);$('#Ca').setAttribute('d',`M${cl} ${cy}l-10 -6v12z`);$('#T').setAttribute('x1',75);$('#T').setAttribute('x2',tl);$('#Ta').setAttribute('d',`M${tl} 310l-10 -6v12z`);$('#ct').setAttribute('y',cy-8);const cracks=$('#cracks');cracks.innerHTML='';if(cracked){for(let i=0;i<4;i++){const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M${25+i*23} 340 l4 -17 l-3 -15`);p.setAttribute('stroke','#d83b3b');p.setAttribute('fill','none');p.setAttribute('stroke-width','2');cracks.append(p)}}$('#narration').textContent=K===0?'没有变形，就没有由这次弯曲产生的应变与抗力。':Math.abs(ratio-1)<.15?'当前压、拉合力接近平衡；截面状态可能成为一个可接受的平衡解。':ratio>1?'当前假定的混凝土压力大于钢筋拉力。需要移动中性轴或重新求材料状态。':'当前假定的钢筋拉力大于混凝土压力。截面尚未满足内力平衡。'}[k,x,rho].forEach(e=>e.addEventListener('input',update));update();
</script></body></html>
